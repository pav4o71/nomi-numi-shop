# Portable PR quality gate for Phase 2C onward.
# Read-only CI only: no production secrets, no deployment, no local Docker resources.
name: PR Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/var/playwright-browsers
      TMPDIR: ${{ github.workspace }}/var/tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Job-level TMPDIR / PLAYWRIGHT_BROWSERS_PATH live under var/; create
      # them before any step that resolves temporary directories.
      - name: Prepare project temp directories
        run: mkdir -p var/playwright-browsers var/tmp

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.26.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Portable unit suite only. Path-locked database/drizzle safety tests
      # require the workstation canonical root and stay local (`pnpm test`).
      - name: Unit tests
        run: pnpm test:ci

      - name: Production build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium Playwright E2E
        run: pnpm test:e2e
