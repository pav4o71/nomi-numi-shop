# Portable PR quality gate with split jobs and aggregation.
# Read-only CI only: no production secrets, no deployment, no local Docker resources.
name: PR Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  path-filter:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'next.config.*'
              - 'tsconfig*.json'
              - '.github/workflows/pr-quality.yml'
              - 'scripts/**'

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0

      - name: Set up Node.js
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migration history check
        run: pnpm db:check:portable

  unit-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      TMPDIR: ${{ github.workspace }}/var/tmp

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare project temp directories
        run: mkdir -p var/tmp

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0

      - name: Set up Node.js
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Portable unit suite only. Path-locked database/drizzle safety tests
      # require the workstation canonical root and stay local (`pnpm test`).
      - name: Unit tests
        run: pnpm test:ci

      - name: Production build
        run: pnpm build

  postgres-integration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      NOMI_CI_POSTGRES_PASSWORD: nomi-ci-postgres-ephemeral-password-0000001

    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_DB: nomi_numi_shop_test
          POSTGRES_USER: nomi_numi_test
          POSTGRES_PASSWORD: ${{ env.NOMI_CI_POSTGRES_PASSWORD }}
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --port 5432 --username nomi_numi_test --dbname nomi_numi_shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0

      - name: Set up Node.js
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and verify committed migrations
        run: pnpm db:migrate:ci

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: path-filter
    if: needs.path-filter.result == 'success' && needs.path-filter.outputs.code == 'true'
    permissions:
      contents: read
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/var/playwright-browsers
      TMPDIR: ${{ github.workspace }}/var/tmp

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare project temp directories
        run: mkdir -p var/playwright-browsers var/tmp

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0

      - name: Set up Node.js
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [path-filter, static, unit-build, postgres-integration, e2e]
    if: always()
    steps:
      - name: Aggregate status
        run: |
          echo "Path filter: ${{ needs.path-filter.result }}"
          echo "Relevant code changes: ${{ needs.path-filter.outputs.code }}"
          echo "Static checks: ${{ needs.static.result }}"
          echo "Unit tests and build: ${{ needs.unit-build.result }}"
          echo "PostgreSQL migration integration: ${{ needs.postgres-integration.result }}"
          echo "E2E tests: ${{ needs.e2e.result }}"

          if [ "${{ needs.path-filter.result }}" != "success" ]; then
            echo "Path filter failed"
            exit 1
          fi

          if [ "${{ needs.static.result }}" != "success" ]; then
            echo "Static checks failed"
            exit 1
          fi

          if [ "${{ needs.unit-build.result }}" != "success" ]; then
            echo "Unit tests or build failed"
            exit 1
          fi

          if [ "${{ needs.postgres-integration.result }}" != "success" ]; then
            echo "PostgreSQL migration integration failed"
            exit 1
          fi

          if [ "${{ needs.e2e.result }}" = "skipped" ]; then
            if [ "${{ needs.path-filter.outputs.code }}" != "false" ]; then
              echo "E2E was skipped without a successful no-relevant-changes result"
              exit 1
            fi
          elif [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E tests failed"
            exit 1
          fi

          echo "All checks passed"
